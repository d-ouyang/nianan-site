name: deploy

# 打 tag 推送（v*）即自动构建并部署到服务器 nianan.site
# 也可在 GitHub Actions 页面手动触发（workflow_dispatch，用于重发同一版本）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 同一时间只允许一个部署在跑；新部署排队时取消旧的
concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    # 与 rag-qa-system 共用同一台服务器上的 self-hosted runner 体系
    # （runner 需注册到本仓库，见 docs/部署-自动发布.md）
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 容器内构建：与服务器环境解耦，Node/pnpm 版本锁死，宿主机无需装任何东西
      #
      # ⚠️ 两处都是踩过坑才加的（2026-10-14）：
      #   1. registry 指国内镜像：官方源在国内服务器直连 ETIMEDOUT。
      #      npm 用 env、pnpm 用 --registry 显式指定（pnpm 自己的配置优先级高，
      #      只给 env 不管用）。
      #   2. --store-dir 指到挂载的 named volume：pnpm 11 默认把 store 放在
      #      **项目目录内**的 .pnpm-store —— 它会被 runner 清理工作区时连锅端走
      #      （下次构建没缓存就得现拉，网络一抖就超时），且残留文件属主是 root，
      #      会让 runner 清目录时报 EACCES。挪到卷里：缓存持久 + 不污染仓库。
      - name: Build (node:22-alpine)
        run: |
          docker run --rm \
            -e npm_config_registry=https://registry.npmmirror.com \
            -e HOST_UID=$(id -u) -e HOST_GID=$(id -g) \
            -v "$PWD":/app -w /app \
            -v site_pnpm_store:/root/.local/share/pnpm/store \
            node:22-alpine sh -c 'npm i -g pnpm@11 --no-fund --no-audit \
              && pnpm install --frozen-lockfile \
                   --registry=https://registry.npmmirror.com \
                   --store-dir=/root/.local/share/pnpm/store \
              && pnpm build \
              && chown -R $HOST_UID:$HOST_GID /app'

      # 静态产物发布到宿主 /var/www/personal（Caddy file_server 指向这里）
      - name: Publish to /var/www/personal
        run: |
          test -f "$PWD/dist/index.html" || { echo "❌ dist/index.html 不存在，构建产物异常"; exit 1; }
          rsync -a --delete "$PWD/dist/" /var/www/personal/
          chmod -R a+rX /var/www/personal
          echo "✅ 部署完成：https://nianan.site（静态产物无需 reload Caddy）"
